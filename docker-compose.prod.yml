services:
  # ---------------------------------------------------------------------------
  # MediaForge Spring Boot Backend Service (Stateless, Database-Free)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mediaforge-backend:1.0.0
    container_name: mediaforge-backend-prod
    restart: unless-stopped
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://mediaforge.local}
      STORAGE_LOCAL_PATH: /app/uploads
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      CONVERTER_STORAGE_DIR: /app/storage/conversions
      CONVERTER_SCRATCH_DIR: /app/storage/scratch
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
      STORAGE_RETENTION_HOURS: 24
      JAVA_OPTS: "-Xms512m -Xmx1536m -XX:+UseG1GC"
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_conversions:/app/storage/conversions
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mediaforge-prod-net

  # ---------------------------------------------------------------------------
  # MediaForge Web Portal Frontend Service (Next.js Standalone SSR)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: mediaforge-web:1.0.0
    container_name: mediaforge-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://backend:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mediaforge-prod-net

volumes:
  backend_uploads:
    name: mediaforge_prod_uploads
  backend_conversions:
    name: mediaforge_prod_conversions

networks:
  mediaforge-prod-net:
    name: mediaforge-prod-network
    driver: bridge


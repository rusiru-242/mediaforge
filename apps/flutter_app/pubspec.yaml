name: mediaforge_desktop
description: MediaForge - Cross-platform desktop media downloader and converter
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.6.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  http: ^1.2.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  desktop_drop: ^0.4.4
  window_manager: ^0.4.3
  process_run: ^1.2.1
  uuid: ^4.5.1
  share_plus: ^10.1.2
  intl: ^0.19.0
  logger: ^2.5.0
  mime: ^2.1.0
  path: ^1.9.1
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

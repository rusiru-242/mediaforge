services:
  # ---------------------------------------------------------------------------
  # Spring Boot Backend API Service (Database-Free, In-Memory Ephemeral Engine)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediaforge-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      STORAGE_LOCAL_PATH: /app/uploads
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      CONVERTER_STORAGE_DIR: /app/storage/conversions
      CONVERTER_SCRATCH_DIR: /app/storage/scratch
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
    ports:
      - "8080:8080"
    volumes:
      - mediaforge_uploads:/app/uploads
      - mediaforge_conversions:/app/storage/conversions
    networks:
      - mediaforge-network

volumes:
  mediaforge_uploads:
    name: mediaforge_uploads_data
  mediaforge_conversions:
    name: mediaforge_conversions_data

networks:
  mediaforge-network:
    name: mediaforge-network
    driver: bridge

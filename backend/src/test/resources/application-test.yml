server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:mediaforge_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  storage:
    base-path: ./target/test-storage
    retention-hours: 24
  downloader:
    max-file-size-bytes: 104857600
  converter:
    ffmpeg-path: ffmpeg
    ffprobe-path: ffprobe
    max-file-size-bytes: 104857600
    timeout-seconds: 60
    max-concurrent-jobs: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create draft release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Universal Test Suite Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test Spring Boot Backend
        working-directory: backend
        run: mvn -B clean verify

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Test & Build Next.js Web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Test Flutter Application
        working-directory: apps/flutter_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  build-backend-jar:
    name: Package Backend Executable JAR
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package JAR
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Backend-1.0.0.jar
          path: backend/target/mediaforge-backend-1.0.0.jar

  build-windows:
    name: Build Windows Desktop Release
    needs: validate-and-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Portable Windows ZIP
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MediaForge-Windows-Portable-1.0.0.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Windows-Portable-1.0.0.zip
          path: apps/flutter_app/MediaForge-Windows-Portable-1.0.0.zip

  build-android:
    name: Build Android APK Release
    needs: validate-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk MediaForge-Android-1.0.0.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Android-1.0.0.apk
          path: apps/flutter_app/MediaForge-Android-1.0.0.apk

  build-macos:
    name: Build macOS Desktop Release
    needs: validate-and-test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release --no-codesign

      - name: Package macOS ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../MediaForge-macOS-1.0.0.zip MediaForge.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-macOS-1.0.0.zip
          path: apps/flutter_app/MediaForge-macOS-1.0.0.zip

  build-linux:
    name: Build Linux Desktop Release
    needs: validate-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Tarball
        run: |
          tar -czvf MediaForge-Linux-x64-1.0.0.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Linux-x64-1.0.0.tar.gz
          path: apps/flutter_app/MediaForge-Linux-x64-1.0.0.tar.gz

  publish-release:
    name: Assemble & Publish GitHub Release
    needs:
      - build-backend-jar
      - build-windows
      - build-android
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Draft GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.draft != ''
        with:
          name: MediaForge ${{ github.ref_name || github.event.inputs.release_version }}
          tag_name: ${{ github.ref_name || github.event.inputs.release_version }}
          draft: ${{ github.event.inputs.draft == 'true' || true }}
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*

name: Flutter Desktop CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'chore/**'
      - 'refactor/**'
      - 'test/**'
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/flutter-desktop-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/flutter-desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Flutter Analyze & Unit/Widget Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test --coverage

  build-windows:
    name: Build Windows Desktop
    needs: analyze-and-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-desktop-windows
          path: apps/flutter_app/build/windows/x64/runner/Release/
          retention-days: 7

  build-macos:
    name: Build macOS Desktop
    needs: analyze-and-test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release --no-codesign

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-desktop-macos
          path: apps/flutter_app/build/macos/Build/Products/Release/
          retention-days: 7

  build-linux:
    name: Build Linux Desktop
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-desktop-linux
          path: apps/flutter_app/build/linux/x64/release/bundle/
          retention-days: 7

name: Flutter Mobile CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'chore/**'
      - 'refactor/**'
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/flutter-mobile-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/flutter-mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-analyze-and-test:
    name: Mobile Analyze & Unit/Widget Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-infos

      - name: Run Mobile & Adaptive Tests
        run: flutter test

  build-android:
    name: Build Android Debug APK
    needs: mobile-analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-android-debug-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Simulator Runner
    needs: mobile-analyze-and-test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator (No Codesign)
        run: flutter build ios --no-codesign --simulator
